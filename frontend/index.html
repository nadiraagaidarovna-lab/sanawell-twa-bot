<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>SanaWell — поддержка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main id="app">

  <!-- ЭКРАН 0: Выбор языка (первое, что видит новый пользователь) -->
  <section id="screen-language" class="screen hidden">
    <div class="card welcome-card">
      <p class="eyebrow">SanaWell</p>
      <h1 data-i18n="languageScreen.title"></h1>
      <p class="body-text" data-i18n="languageScreen.subtitle"></p>
      <button class="btn-primary lang-btn" data-lang="kk">Қазақша</button>
      <button class="btn-secondary lang-btn" data-lang="ru">Русский</button>
    </div>
  </section>

  <!-- ЭКРАН 1: Онбординг / согласие -->
  <section id="screen-onboarding" class="screen hidden">
    <div class="card welcome-card">
      <p class="eyebrow" data-i18n="onboarding.eyebrow"></p>
      <h1 data-i18n="onboarding.title"></h1>
      <p class="body-text" data-i18n="onboarding.p1"></p>
      <p class="body-text" data-i18n="onboarding.p2"></p>

      <div class="consent-box">
        <label class="consent-row">
          <input type="checkbox" id="consent-checkbox" />
          <span data-i18n="onboarding.consentLabel"></span>
        </label>
        <label class="consent-row">
          <input type="checkbox" id="reminder-checkbox" />
          <span data-i18n="onboarding.reminderLabel"></span>
        </label>
      </div>

      <button id="btn-enter" class="btn-primary" disabled data-i18n="onboarding.enterButton"></button>
      <p class="fine-print" data-i18n="onboarding.finePrint"></p>
    </div>
  </section>

  <!-- ЭКРАН 2: Трекер — три кнопки -->
  <section id="screen-tracker" class="screen hidden">
    <div class="topbar">
      <p class="eyebrow" data-i18n="tracker.eyebrow"></p>
    </div>

    <div class="tracker-grid">
      <button class="tracker-tile" data-module="sleep">
        <span class="tile-icon">🌙</span>
        <span><span class="tile-title" data-i18n="tracker.sleepTitle"></span><span class="tile-sub" data-i18n="tracker.sleepSub"></span></span>
      </button>

      <button class="tracker-tile" data-module="mood">
        <span class="tile-icon">🌊</span>
        <span><span class="tile-title" data-i18n="tracker.moodTitle"></span><span class="tile-sub" data-i18n="tracker.moodSub"></span></span>
      </button>

      <button class="tracker-tile" data-module="cognitive">
        <span class="tile-icon">☁️</span>
        <span><span class="tile-title" data-i18n="tracker.cognitiveTitle"></span><span class="tile-sub" data-i18n="tracker.cognitiveSub"></span></span>
      </button>
    </div>

    <button id="btn-show-progress" class="btn-secondary" data-i18n="tracker.progressButton"></button>
    <button id="btn-show-all-protocols" class="btn-secondary" data-i18n="tracker.allProtocolsButton"></button>
  </section>

  <!-- ЭКРАН 2b: Выбор конкретного состояния внутри модуля -->
  <section id="screen-detail" class="screen hidden">
    <button class="btn-back" data-back-to="tracker" data-i18n="detail.backLabel"></button>
    <h2 id="detail-title"></h2>
    <div id="detail-options" class="options-list"></div>

    <div class="optional-note">
      <label for="detail-freetext" data-i18n="detail.freetextLabel"></label>
      <textarea id="detail-freetext" rows="2"></textarea>
    </div>
  </section>

  <!-- ЭКРАН 3: Карточки протоколов самопомощи -->
  <section id="screen-protocols" class="screen hidden">
    <button class="btn-back" data-back-to="tracker" data-i18n="detail.backLabel"></button>
    <h2 id="protocols-title"></h2>
    <div id="protocols-list" class="protocols-list"></div>
  </section>

  <!-- ЭКРАН 4: Безопасность — редирект к специалисту -->
  <section id="screen-safety" class="screen hidden">
    <div class="card safety-card">
      <p id="safety-message" class="body-text"></p>
      <div id="safety-resources" class="safety-resources"></div>
      <button class="btn-secondary" data-back-to="tracker" data-i18n="safety.back"></button>
    </div>
  </section>

  <!-- ЭКРАН 5: "Мой путь" — прогресс за 7-14 дней + смена языка + напоминания -->
  <section id="screen-progress" class="screen hidden">
    <button class="btn-back" data-back-to="tracker" data-i18n="progress.backButton"></button>
    <h2 data-i18n="progress.title"></h2>
    <p class="body-text" data-i18n="progress.subtitle"></p>

    <div id="progress-empty-hint" class="body-text hidden" data-i18n="progress.emptyHint"></div>
    <div id="progress-grid" class="progress-grid"></div>

    <div class="progress-section">
      <p class="section-label" data-i18n="progress.reminderSectionTitle"></p>
      <label class="consent-row">
        <input type="checkbox" id="reminder-toggle" />
        <span data-i18n="progress.reminderToggleLabel"></span>
      </label>
    </div>

    <div class="progress-section">
      <p class="section-label" data-i18n="progress.changeLanguage"></p>
      <div class="lang-switch">
        <button class="btn-secondary lang-btn" data-lang="ru">Русский</button>
        <button class="btn-secondary lang-btn" data-lang="kk">Қазақша</button>
      </div>
    </div>
  </section>

</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
